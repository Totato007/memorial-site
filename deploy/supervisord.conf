# 纪念站 Supervisor 守护进程配置
# 位置: /etc/supervisor/conf.d/memorial.conf
#
# 部署步骤:
#   1. sudo apt install supervisor
#   2. sudo cp supervisord.conf /etc/supervisor/conf.d/memorial.conf
#   3. sudo supervisorctl reread && sudo supervisorctl update
#   4. sudo supervisorctl start memorial

[program:memorial]
# Go 二进制文件路径
command=/opt/memorial/memorial-site
directory=/opt/memorial

# 环境变量 (按需修改)
environment=
    PORT="8080",
    DB_PATH="/opt/memorial/data/memorial.db",
    UPLOAD_DIR="/opt/memorial/uploads",
    JWT_SECRET="change-me-to-a-random-64-character-string",
    ADMIN_USER="admin",
    ADMIN_PASS="change-me-to-a-strong-password",
    GIN_MODE="release"

user=www-data
autostart=true
autorestart=true
startretries=3

# 日志
stdout_logfile=/var/log/memorial/stdout.log
stderr_logfile=/var/log/memorial/stderr.log
