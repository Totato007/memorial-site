{{ define "error.html" }}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    {{ template "header" . }}
    <title>{{ .title }} - 纪念站</title>
</head>
<body>
    {{ template "nav" . }}
    <main class="container">
        <div class="error-page">
            <h1>{{ .code }}</h1>
            <p>{{ .message }}</p>
            <a href="/dashboard" class="btn btn-primary">返回首页</a>
        </div>
    </main>
    {{ template "footer" . }}
</body>
</html>
{{ end }}
